services:
  mongo:
    image: mongo:7
    container_name: ib_mongo
    restart: unless-stopped
    # Xost 27017 da Windows MongoDB xizmati ishlayotgani uchun to'qnashmaslik
    # maqsadida Docker Mongo xostda 27018 ga chiqariladi (ichkarida esa 27017).
    # Faqat 127.0.0.1 ga bog'lanadi — DB porti hech qachon tashqi dunyoga
    # ochilmaydi (serverda ufw ham 27018 ni bloklaydi).
    #
    # PRODUCTION (Hetzner Cloud server): baza shu konteynerda, ma'lumot
    # `mongo_data` volume'ida. Ya'ni server o'chsa/volume yo'qolsa ma'lumot ham
    # ketadi — shuning uchun deploy/backup-mongo.sh kunlik arxiv oladi.
    # Boshqarilayotgan baza (masalan MongoDB Atlas) kerak bo'lsa: .env dagi
    # MONGO_URI ni o'zgartiring — bu konteyner shundan keyin ishlatilmaydi.
    #
    # RAM: WiredTiger standart holatda (RAM-1GB)/2 ni oladi — 4GB serverda bu
    # ~1.5GB, ya'ni Next.js SSR va build uchun joy tor qoladi. 1GB ga aniq
    # cheklaymiz: hozirgi baza hajmida bu yetarli, qolgan RAM esa ilovaga
    # tegadi. Serverni kattalashtirsangiz shu qiymatni ham oshiring.
    command: ["mongod", "--wiredTigerCacheSizeGB", "1"]
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: ib_backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      # Only the host reverse proxy may reach the plaintext API directly.
      # Public clients must use the TLS virtual host.
      - "127.0.0.1:8080:8080"
    env_file: .env
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
      MONGO_DB: ${MONGO_DB:-ishchibormi}
      HTTP_ADDR: ":8080"
      # Prod default'lar. CORS noto'g'ri bo'lsa brauzer frontend so'rovlarini
      # bloklaydi.
      CORS_ORIGINS: ${CORS_ORIGINS:-https://ishchibormi.uz}
      # ATAYLAB literal (interpolatsiyasiz): ${VAR:-...} shakli qiymatni .env
      # faylidan parse vaqtida oladi, ya'ni diskda eski dev .env qolgan bo'lsa
      # prod'da APP_ENV=dev + OTP_DEV_RETURN=true (OTP kodini API javobida
      # qaytaradi!) yoqilib qolardi. Bu fayl bilan prod'ni dev rejimga o'tkazib
      # BO'LMAYDI — lokal dev uchun deploy/docker-compose.dev.yml overlay'ini
      # ishlating (yoki oddiygina `make dev`).
      APP_ENV: "production"
      OTP_DEV_RETURN: "false"
      # Google Play review login — .env yo'q bo'lsa HAR DOIM o'chiq.
      # Yoqish faqat ataylab qilingan amal bo'lishi kerak; batafsil izoh
      # .env.example va apps/api/internal/auth/review.go da.
      REVIEW_LOGIN_ENABLED: ${REVIEW_LOGIN_ENABLED:-false}
      REVIEW_LOGIN_CODE: ${REVIEW_LOGIN_CODE:-}
      REVIEW_LOGIN_EXPIRES_AT: ${REVIEW_LOGIN_EXPIRES_AT:-}
      REVIEW_LOGIN_USER_ID: ${REVIEW_LOGIN_USER_ID:-}
      # Prod serverda backend xostdagi Caddy (TLS) ortida ishlaydi, shuning uchun
      # standart "true": klient IP X-Forwarded-For'dan olinadi (rate-limit
      # har bir foydalanuvchi bo'yicha to'g'ri ishlashi uchun). .env buni
      # override qila oladi (masalan proksisiz sinovda "false").
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      # Caddy yagona proksi — mijoz IP'si X-Forwarded-For'ning eng oxirgi
      # elementi. CDN qo'shsangiz 2 qiling (.env.example'ga qarang).
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      # O'chirilgan hisoblar shuncha kundan keyin butunlay yo'q qilinadi.
      # Foydalanuvchiga /delete-account va /maxfiylik-siyosati sahifalarida
      # aytiladigan muddat bilan bir xil bo'lishi SHART (apps/web/lib/retention.ts).
      ACCOUNT_RETENTION_DAYS: ${ACCOUNT_RETENTION_DAYS:-90}
      # Mobil push (FCM). Yagona shart — serverda ./secrets/fcm-service-account.json
      # faylining borligi (Firebase Console -> Service accounts -> Generate new
      # private key). Deploy skripti faylni ko'rsa .env ga shu o'zgaruvchini
      # yozadi, ko'rmasa bo'sh qoldiradi va push jimgina o'chiq qoladi — API
      # to'liq ishlayveradi. Bu qatorlar ATAYLAB izohda emas: deploy serverda
      # `git reset --hard` qiladi, ya'ni qo'lda ochilgan izoh har deploy'da
      # yopilib, push jimgina o'chib qolardi.
      FCM_CREDENTIALS_FILE: ${FCM_CREDENTIALS_FILE:-}

      # Kontent moderatsiyasi (Google Gemini). Kalit .env dan olinadi va
      # FAQAT backend konteynerida qoladi — frontend servisiga uzatilmaydi
      # (u NEXT_PUBLIC_* dan boshqa hech narsani ko'rmaydi).
      # Bo'sh bo'lsa moderatsiya jimgina o'chiq, API to'liq ishlayveradi.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-20}
      MODERATION_MAX_IMAGE_MB: ${MODERATION_MAX_IMAGE_MB:-8}
      MODERATION_ENFORCE: ${MODERATION_ENFORCE:-false}
      MODERATION_STRIKE_LIMIT: ${MODERATION_STRIKE_LIMIT:-3}
      MODERATION_BAN_DAYS: ${MODERATION_BAN_DAYS:-730}
      MODERATION_FAIL_CLOSED: ${MODERATION_FAIL_CLOSED:-false}
    volumes:
      - avatars:/data/avatars
      - uploads:/app/data/uploads
      # Aniq fayl emas, butun papka mount qilinadi: fayl yo'q bo'lsa Docker
      # uning o'rniga papka yaratib qo'yardi va konteyner ishga tushmasdi.
      # Papkaning o'zi yo'q bo'lsa bo'sh holda yaratiladi — zarari yo'q.
      - ./secrets:/app/secrets:ro
    healthcheck:
      # /healthz JSON endpoint. busybox wget (alpine base) exits non-zero on any
      # non-2xx, so the container is "healthy" only once the API actually serves.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  bot:
    build:
      context: ./apps/bots/otp
      dockerfile: Dockerfile
    container_name: ib_bot
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file: .env
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
      MONGO_DB: ${MONGO_DB:-ishchibormi}

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      # MUHIM: NEXT_PUBLIC_* qiymatlari build vaqtida kodga yoziladi, shuning
      # uchun ularni build args sifatida uzatamiz (aks holda localhost qoladi).
      # Default'lar PRODUCTION (ishchibormi.uz) — lokal dev uchun .env ustun
      # keladi (masalan localhost). Serverda .env bu kalitlarni bermasa, prod
      # qiymatlar ishlatiladi.
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-https://ishchibormi.uz}
        NEXT_PUBLIC_WS_BASE: ${NEXT_PUBLIC_WS_BASE:-wss://ishchibormi.uz}
        NEXT_PUBLIC_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-Ishchibormibot}
        # Maxfiy: .env dan keladi, standart qiymati ATAYLAB yo'q. Bo'sh
        # bo'lsa panel eski joyida (/admin) ochilaveradi.
        ADMIN_PANEL_HOST: ${ADMIN_PANEL_HOST:-}
    container_name: ib_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-https://ishchibormi.uz}
      NEXT_PUBLIC_WS_BASE: ${NEXT_PUBLIC_WS_BASE:-wss://ishchibormi.uz}
      NEXT_PUBLIC_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-Ishchibormibot}
      ADMIN_PANEL_HOST: ${ADMIN_PANEL_HOST:-}

volumes:
  mongo_data:
  avatars:
  uploads:
