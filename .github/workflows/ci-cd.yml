name: CI/CD

# Qachon ishga tushadi:
#  - main branch'ga push bo'lganda  -> test + deploy
#  - Pull Request ochilganda        -> faqat test (deploy yo'q)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Bir vaqtning o'zida faqat bitta deploy ishlasin (eskisi to'xtatiladi)
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────
  # 1) CI: kod sifatini tekshirish (test + lint)
  # ───────────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      # --- Go (api + OTP bot) ---
      - name: Go o'rnatish
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: |
            apps/api/go.sum
            apps/bots/otp/go.sum

      - name: API - vet & test
        working-directory: apps/api
        run: |
          go vet ./...
          go test ./...

      - name: OTP bot - vet & test
        working-directory: apps/bots/otp
        run: |
          go vet ./...
          go test ./...

      # --- Frontend (Next.js) ---
      - name: Node o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json

      - name: Web - install
        working-directory: apps/web
        run: npm ci

      - name: Web - lint
        working-directory: apps/web
        run: npm run lint --if-present

      - name: Web - build (xatolarni erta tutish uchun)
        working-directory: apps/web
        run: npm run build --if-present

  # ───────────────────────────────────────────────
  # 2) CD: Hetzner serverga deploy
  #    Faqat main'ga push bo'lganda VA test o'tgandan keyin
  #
  #    Server tayyorlash (bir marta): deploy/server-setup.sh
  #    TLS/reverse-proxy: xostdagi Caddy (deploy/Caddyfile) — bu pipeline unga
  #    TEGMAYDI. Caddyfile o'zgarsa serverda qo'lda yangilang:
  #      sudo cp deploy/Caddyfile /etc/caddy/Caddyfile && sudo systemctl reload caddy
  # ───────────────────────────────────────────────
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      # appleboy/ssh-action `script_stop: true` bilan HAR BIR QATOR orasiga
      # o'zining exit-code tekshiruvini qo'shadi. Ko'p qatorli secret to'g'ridan-
      # to'g'ri `script:` ichiga qo'yilsa, uning qatorlari orasiga ham shu shell
      # kodi tushadi va JSON butunlay buziladi — serverdagi faylda
      # `DRONE_SSH_PREV_COMMAND_EXIT_CODE=...` qatorlari paydo bo'ladi, backend
      # esa "invalid character" deb push'ni o'chiradi.
      # Yechim: JSON'ni BITTA QATORLIK base64 ga o'tkazib uzatamiz.
      - name: FCM secret'ni base64 ga o'tkazish
        id: fcm
        env:
          FCM_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FCM_JSON" ]; then
            B64=$(printf '%s' "$FCM_JSON" | base64 -w0)
            # Secretdan hosil qilingan qiymat avtomatik maskalanmaydi — o'zimiz qilamiz.
            echo "::add-mask::$B64"
            echo "b64=$B64" >> "$GITHUB_OUTPUT"
            echo "FCM secret topildi (${#FCM_JSON} bayt) -> base64 tayyor"
          else
            echo "b64=" >> "$GITHUB_OUTPUT"
            echo "FCM secret bo'sh -> serverdagi mavjud fayl saqlanadi"
          fi

      - name: Serverga SSH orqali deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: "20m"
          script: |
            set -e
            cd ${{ secrets.PROJECT_DIR }}

            echo "==> Eng so'nggi kodni tortib olish"
            git fetch --all
            git reset --hard origin/main

            echo "==> Telegram bot sozlamalarini .env ga yozish"
            # MUHIM: .env gitignore qilingan, shuning uchun "git reset --hard"
            # unga tegmaydi. Bot token/username shu yerda o'rnatilmasa, server
            # eski/bo'sh qiymatda qoladi -> bot ishga tushmaydi va login
            # sahifasidagi havola noto'g'ri bo'ladi. Mavjud .env kalitlari
            # (JWT, Mongo va h.k.) saqlanadi, faqat kerakli kalitlar yangilanadi.
            set_env() {
              key="$1"; value="$2"; tmp="$(mktemp)"
              if [ -f .env ]; then grep -v -E "^${key}=" .env > "$tmp" || true; else : > "$tmp"; fi
              printf '%s=%s\n' "$key" "$value" >> "$tmp"
              mv "$tmp" .env
            }

            BOT_TOKEN='${{ secrets.TELEGRAM_BOT_TOKEN }}'
            if [ -z "$BOT_TOKEN" ]; then
              echo "XATO: TELEGRAM_BOT_TOKEN GitHub secret'i o'rnatilmagan."
              echo "Qo'shish: Repo -> Settings -> Secrets and variables -> Actions -> New repository secret."
              exit 1
            fi
            set_env TELEGRAM_BOT_TOKEN "$BOT_TOKEN"
            set_env TELEGRAM_BOT_USERNAME Ishchibormibot

            # Access token muddati (daqiqada). 4320 = 72 soat. Serverdagi .env
            # gitignore qilingani uchun bu qiymat har deploy'da majburan yoziladi.
            # O'g'irlangan token oldin 15 kun yashardi — endi ko'pi 3 kun; mobil
            # ilova refresh oqimi bilan o'zi yangilaydi, web ~3 kunda qayta kiradi.
            # Bu maxfiy emas, shuning uchun oddiy set_env.
            set_env JWT_ACCESS_TTL_MIN 4320

            # Admin sessiyasi 3 kun foydalanilmasa yopiladi (veb va mobil
            # ilova uchun BIRGALIKDA — batafsil .env.example da). Maxfiy
            # emas, lekin serverdagi .env gitignore qilingani uchun har
            # deploy'da majburan yoziladi.
            set_env ADMIN_IDLE_TTL_HOURS 72

            # Fayl yuklash manzili. S3 sozlanmagan bo'lsa backend rasmlarni
            # lokal diskda saqlaydi va ularni /uploads ostida o'zi tarqatadi
            # (Caddy /uploads/* ni backend'ga yo'naltiradi). APP_ENV=production
            # da config.go bu qiymat HTTPS bo'lishini TALAB qiladi — noto'g'ri
            # bo'lsa API umuman ishga tushmaydi. Shuning uchun har deploy'da
            # majburan yoziladi: bu maxfiy emas, faqat to'g'ri bo'lishi shart.
            set_env UPLOAD_PUBLIC_BASE https://ishchibormi.uz/uploads

            echo "==> MongoDB ulanishini .env ga yozish (GitHub secret bo'lsa)"
            # MONGO_URI maxfiy (parol bor) -> faqat GitHub secret orqali keladi,
            # hech qachon repoga yozilmaydi. Secret o'rnatilgan bo'lsa serverdagi
            # .env yangilanadi; bo'lmasa mavjud qiymat saqlanadi (deploy buzilmaydi).
            MONGO_URI_SECRET='${{ secrets.MONGO_URI }}'
            MONGO_DB_SECRET='${{ secrets.MONGO_DB }}'
            # Bitta qatorda — yuqoridagi set_env_if_set izohiga qarang.
            if [ -n "$MONGO_URI_SECRET" ]; then set_env MONGO_URI "$MONGO_URI_SECRET"; set_env MONGO_DB "${MONGO_DB_SECRET:-ishchibormi}"; echo "MONGO_URI .env ga yozildi."; else echo "OGOHLANTIRISH: MONGO_URI secret o'rnatilmagan -> serverdagi mavjud .env qiymati saqlanadi."; fi

            # ── Qolgan ilova secretlarini .env ga yozish ──────────────────────
            # JWT/BOT_SHARED_SECRET/ADMIN_SEED_PASS/AWS kalitlari ilgari faqat
            # serverdagi .env da qo'lda turardi. Endi ular ham GitHub secretlardan
            # boshqariladi: .env to'liq qayta tiklanadi va rotatsiya = secretni
            # yangilab qayta deploy qilish. MONGO/Telegram mantiqiga TEGILMAGAN.
            #
            # set_env_if_set: secret BO'SH BO'LMAGANDAGINA .env ga yozadi. Bo'sh
            # bo'lsa serverdagi MAVJUD qiymatni saqlaydi (bo'sh qiymat bilan qayta
            # yozib, kalitni yo'q qilib qo'ymaydi). Faqat kalit NOMINI chop etadi
            # — qiymatlar hech qachon log'ga chiqmaydi (ular GitHub tomonidan ham
            # avtomatik maskalanadi). Bu yordamchi mavjud set_env() ustiga quriladi.
            #
            # DIQQAT — `if` lar shu skriptda ATAYLAB BITTA QATORDA yozilgan.
            # appleboy/ssh-action (script_stop) har bir qator orasiga o'zining
            # exit-code tekshiruvini qo'shadi. Ko'p qatorli `else` da o'sha
            # tekshiruv `else` dan KEYIN tushadi va $? sifatida yolg'on
            # chiqqan shartdan qolgan 1 ni ko'radi -> deploy XATO XABARISIZ
            # to'xtaydi. Aynan shu sabab birinchi bo'sh ixtiyoriy secret
            # (ADMIN_PANEL_HOST) butun deploy'ni yiqitgan edi: na "yangilandi",
            # na "bo'sh" chiqmay, "Process exited with status 1" bo'lgan.
            # Bitta qatorda esa butun `if` bitta buyruq bo'lib, 0 qaytaradi.
            set_env_if_set() {
              key="$1"; value="$2"
              if [ -n "$value" ]; then set_env "$key" "$value"; echo "  $key: yangilandi"; else echo "  $key: secret bo'sh -> serverdagi mavjud .env qiymati saqlandi"; fi
            }

            echo "==> Ilova secretlarini .env ga yozish (bo'shlari o'tkazib yuboriladi)"
            # Har bir qiymat single-quote ichida uzatiladi (shell kengaytirishidan
            # himoya) va faqat set_env_if_set orqali yoziladi -> qiymat log'ga
            # chiqmaydi va bo'sh secret mavjud qiymatni buzmaydi.
            set_env_if_set JWT_ACCESS_SECRET     '${{ secrets.JWT_ACCESS_SECRET }}'
            set_env_if_set JWT_REFRESH_SECRET    '${{ secrets.JWT_REFRESH_SECRET }}'
            set_env_if_set BOT_SHARED_SECRET     '${{ secrets.BOT_SHARED_SECRET }}'
            set_env_if_set ADMIN_SEED_PASS       '${{ secrets.ADMIN_SEED_PASS }}'
            # S3 IXTIYORIY: bu secretlar bo'sh bo'lsa (Hetzner'da odatda
            # shunday) backend rasmlarni server diskidagi `uploads` volume'ida
            # saqlaydi — yuqoridagi UPLOAD_PUBLIC_BASE shu holat uchun.
            set_env_if_set AWS_ACCESS_KEY_ID     '${{ secrets.AWS_ACCESS_KEY_ID }}'
            set_env_if_set AWS_SECRET_ACCESS_KEY '${{ secrets.AWS_SECRET_ACCESS_KEY }}'
            # Kontent moderatsiyasi (Google Gemini). Kalit bo'sh bo'lsa
            # serverdagi mavjud qiymat saqlanadi.
            set_env_if_set GEMINI_API_KEY        '${{ secrets.GEMINI_API_KEY }}'
            # Boshqaruv (admin) paneli xosti. MAXFIY: repo ochiq, shuning
            # uchun nom faqat GitHub secret orqali keladi. Next.js middleware
            # shu qiymat bo'yicha ommaviy domenda /admin ni 404 qiladi va
            # panelni faqat o'sha xostda ko'rsatadi.
            #
            # Secret bo'sh bo'lsa serverdagi mavjud qiymat saqlanadi — ya'ni
            # secret'ni qo'shishni unutish panelni o'chirib qo'ymaydi.
            #
            # Qiymat frontend konteynerida RUNTIME da o'qiladi; docker
            # compose uni .env dan oladi, ya'ni shu yerda yozilishi kifoya.
            set_env_if_set ADMIN_PANEL_HOST      '${{ secrets.ADMIN_PANEL_HOST }}'

            # ── Moderatsiyani yoqish ─────────────────────────────────────────
            # Bayroq ATAYLAB kalit mavjudligidan kelib chiqib qo'yiladi.
            #
            # Sabab: config.go productionda MODERATION_ENFORCE=true bo'lsa-yu
            # GEMINI_API_KEY bo'sh bo'lsa ishga tushishdan BOSH TORTADI
            # (log.Fatal). Ya'ni bayroqni qo'lda yoqib, kalitni qo'shishni
            # unutish butun API'ni o'chirib qo'yardi. Bu yerda bunday
            # kombinatsiyani yaratib bo'lmaydi.
            #
            # Kalit yo'q bo'lsa moderatsiya jimgina o'chiq qoladi — API
            # to'liq ishlayveradi (S3/FCM bilan bir xil naqsh).
            if grep -qE '^GEMINI_API_KEY=.+' .env; then set_env MODERATION_ENFORCE true; echo "  MODERATION_ENFORCE: true (GEMINI_API_KEY mavjud)"; else set_env MODERATION_ENFORCE false; echo "  MODERATION_ENFORCE: false (GEMINI_API_KEY yo'q -> moderatsiya o'chiq)"; fi

            # ── Mobil push (FCM) ─────────────────────────────────────────────
            # Service-account fayli serverda ./secrets/ ostida turadi (secrets/
            # gitignore'da, ya'ni "git reset --hard" unga tegmaydi). Fayl bor
            # bo'lsa push yoqiladi, yo'q bo'lsa o'zgaruvchi bo'shatiladi — API
            # o'chib qolmaydi, faqat push jimgina ishlamaydi. Yo'lni qo'lda .env
            # ga yozib qo'yish shart emas: yagona manba quyidagi tekshiruv.
            #
            # Faylning MANBASI — FCM_SERVICE_ACCOUNT_JSON secret'i. Yangi server
            # ko'tarilganda ./secrets/ bo'sh bo'ladi, ya'ni faqat fayl borligini
            # tekshirish push'ni butunlay o'chirib qo'yadi (aynan shu holat
            # Contabo'ga ko'chishda yuz berdi). Secret bo'sh bo'lsa serverdagi
            # mavjud fayl saqlanadi — o'chirilmaydi.
            # Qiymat yuqoridagi qadamda base64 ga o'tkazilgan — bitta qator,
            # ya'ni action'ning qatorlararo shell kodi uni buza olmaydi.
            echo "==> Mobil push (FCM) holati"
            FCM_B64='${{ steps.fcm.outputs.b64 }}'
            if [ -n "$FCM_B64" ]; then
              mkdir -p secrets
              printf '%s' "$FCM_B64" | base64 -d > secrets/fcm-service-account.json
              # Backend konteyneri appuser (uid/gid 10001, apps/api/Dockerfile)
              # sifatida ishlaydi, fayl esa deploy (1001) nomidan yoziladi.
              # 600 + deploy egaligida konteyner faylni OCHA OLMAYDI
              # ("open /app/secrets/...: permission denied" -> push jimgina
              # o'chadi). Shuning uchun guruhni 10001 qilamiz va guruhga
              # o'qish beramiz; papkaga esa kirish (x) huquqi kerak.
              # Dockerfile'dagi UID o'zgarsa, bu raqam ham o'zgarishi shart.
              chgrp 10001 secrets secrets/fcm-service-account.json 2>/dev/null || true
              chmod 750 secrets
              chmod 640 secrets/fcm-service-account.json
              echo "  service-account fayli secret'dan yozildi (gid 10001, 640)"
            fi
            if [ -f secrets/fcm-service-account.json ]; then set_env FCM_CREDENTIALS_FILE /app/secrets/fcm-service-account.json; echo "  secrets/fcm-service-account.json topildi -> push YOQILDI"; else set_env FCM_CREDENTIALS_FILE ""; echo "  secrets/fcm-service-account.json yo'q -> push o'chiq"; fi

            echo "==> Server resurslari (debug: build yiqilsa sabab shu yerda ko'rinadi)"
            free -h || true
            df -h / || true
            docker system df || true

            echo "==> Build'dan oldin bo'sh joy uchun eski/dangling image'larni tozalash"
            docker image prune -f || true

            # Build va ishga tushirishni ajratamiz: shunda build xatosi aniq ko'rinadi
            # (masalan frontend Next.js build'i RAM yetmay "Killed" bo'lsa).
            echo "==> Image'larni build qilish"
            docker compose build

            echo "==> Konteynerlarni ishga tushirish"
            docker compose up -d --remove-orphans

            echo "==> Eski image'larni tozalash"
            docker image prune -f || true

            echo "==> Holat"
            docker compose ps
